name: Release

on:
  workflow_dispatch:
    inputs:
      release_number:
        description: "Release number, e.g. 0.0.8"
        required: true
      target_branch:
        description: "Branch to release from"
        required: true
        default: "main"

permissions:
  contents: write

# Releases push to the target branch and gh-pages, so never run two at once.
concurrency:
  group: release
  cancel-in-progress: false

env:
  XCF_NAME: Shared
  # Only the release XCFramework ships; assembleSharedXCFramework would also link a debug one.
  XCF_GRADLE_TASK: umbrella:assembleSharedReleaseXCFramework
  XCF_OUTPUT_DIR: umbrella/build/XCFrameworks/release
  PAGES_BRANCH: gh-pages

jobs:
  build-and-release:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0

      - name: Prepare Release
        id: release
        shell: bash
        env:
          RELEASE_NUMBER: ${{ inputs.release_number }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_NUMBER" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release number must be semver-like, e.g. 0.0.8 or 0.0.8-beta.1" >&2
            exit 1
          fi

          if ! git check-ref-format --branch "$TARGET_BRANCH" >/dev/null; then
            echo "Invalid target branch: $TARGET_BRANCH" >&2
            exit 1
          fi

          tag_name="v${RELEASE_NUMBER}"
          if git rev-parse -q --verify "refs/tags/${tag_name}" >/dev/null; then
            echo "Tag ${tag_name} already exists locally" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${tag_name}" >/dev/null 2>&1; then
            echo "Tag ${tag_name} already exists on origin" >&2
            exit 1
          fi

          if [[ ! -f gradle.properties ]]; then
            echo "gradle.properties not found" >&2
            exit 1
          fi
          if ! grep -qE '^version[[:space:]]*=' gradle.properties; then
            echo "version property missing in gradle.properties" >&2
            exit 1
          fi

          awk -v version="$RELEASE_NUMBER" '
            /^version[[:space:]]*=/ {
              print "version=" version
              next
            }
            { print }
          ' gradle.properties > gradle.properties.tmp
          mv gradle.properties.tmp gradle.properties

          if git diff --quiet -- gradle.properties; then
            echo "gradle.properties already has version ${RELEASE_NUMBER}" >&2
            exit 1
          fi

          echo "version=$RELEASE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "tag-name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "target-branch=$TARGET_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Read Kotlin version
        id: kotlin
        run: echo "version=$(sed -n 's/^kotlin = "\(.*\)"$/\1/p' gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"

      # Same key as the Gradle CI apple job, so releases reuse the toolchain CI saved on main.
      - name: Cache Kotlin/Native dependencies
        uses: actions/cache@v6
        with:
          path: ~/.konan/dependencies
          key: konan-dependencies-${{ runner.os }}-${{ runner.arch }}-${{ steps.kotlin.outputs.version }}

      - name: Build XCFramework
        run: ./gradlew $XCF_GRADLE_TASK --stacktrace -Dorg.gradle.jvmargs="-Xmx6144m -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options=-Xmx6144m"

      - name: Package XCFramework
        id: package
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.release.outputs.version }}"
          tag_name="${{ steps.release.outputs.tag-name }}"
          archive_name="${XCF_NAME}-${version}.xcframework.zip"
          output_dir="$XCF_OUTPUT_DIR"
          cd "$output_dir"
          rm -f "${XCF_NAME}.xcframework.zip" "$archive_name"
          zip -r "$archive_name" "${XCF_NAME}.xcframework"

          echo "archive-path=$output_dir/$archive_name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag-name=$tag_name" >> "$GITHUB_OUTPUT"

      # Android consumes the GitHub Pages Maven repository; Maven Central releases stay manual.
      - name: Build GitHub Pages Maven Repository
        shell: bash
        env:
          PAGES_DIR: ${{ runner.temp }}/gh-pages
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --heads origin "$PAGES_BRANCH" >/dev/null; then
            git fetch origin "$PAGES_BRANCH"
            git worktree add -B "$PAGES_BRANCH" "$PAGES_DIR" "origin/$PAGES_BRANCH"
          else
            git worktree add --orphan -b "$PAGES_BRANCH" "$PAGES_DIR"
          fi

          # Serve the files as-is instead of building them with Jekyll.
          touch "$PAGES_DIR/.nojekyll"
          ./gradlew publishToGitHubPages --stacktrace -PgithubPagesMavenDir="$PAGES_DIR/maven" -Dorg.gradle.jvmargs="-Xmx6144m -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options=-Xmx6144m"

      - name: Commit and Tag Release
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.release.outputs.version }}"
          tag_name="${{ steps.release.outputs.tag-name }}"
          target_branch="${{ steps.release.outputs.target-branch }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          git commit -m "chore: bump version to ${version}"
          git tag -a "$tag_name" -m "$tag_name"
          git push origin "HEAD:${target_branch}"
          git push origin "$tag_name"

      - name: Push GitHub Pages Maven Repository
        shell: bash
        env:
          PAGES_DIR: ${{ runner.temp }}/gh-pages
        run: |
          set -euo pipefail

          version="${{ steps.release.outputs.version }}"
          cd "$PAGES_DIR"
          git add -A
          git commit -m "chore: publish ${version} to the GitHub Pages Maven repository"
          git push origin "$PAGES_BRANCH"

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.package.outputs.tag-name }}
          name: Shared XCFramework ${{ steps.package.outputs.version }}
          draft: false
          prerelease: ${{ contains(steps.package.outputs.version, '-') }}
          make_latest: ${{ !contains(steps.package.outputs.version, '-') }}
          files: ${{ steps.package.outputs.archive-path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
